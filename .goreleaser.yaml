version: 2

project_name: brw

before:
  hooks:
    - go mod download

builds:
  - main: ./cmd/brw
    binary: brw
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.stampedVersion={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE

homebrew_casks:
  - repository:
      owner: jigsmiths
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/jigsmiths/brw"
    description: "Homebrew-compatible package client written in Go"
    license: "MIT"
    custom_block: |
      auto_updates true

      postflight_steps do
        run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{" }}staged_path{{ "}}" }}/brw"]
      end

checksum:
  name_template: checksums.txt

release:
  replace_existing_artifacts: true

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
