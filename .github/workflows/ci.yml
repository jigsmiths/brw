name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        if: matrix.os == 'ubuntu-latest'
        with:
          version: v2.14.0
          install-only: true
      - run: .githooks/pre-commit
        if: matrix.os == 'ubuntu-latest'
      - run: go test -race ./...
        if: matrix.os != 'ubuntu-latest'
