name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        if: matrix.os == 'ubuntu-latest'
        with:
          version: v2.14.0
      - run: test -z "$(go fix -diff ./...)" || { go fix -diff ./...; exit 1; }
        if: matrix.os == 'ubuntu-latest'
      - run: |
          if git grep -nI -e "$(printf '\342\200\224')"; then echo "remove the em dashes above" >&2; exit 1; fi
        if: matrix.os == 'ubuntu-latest'
      - run: go test -race ./...
