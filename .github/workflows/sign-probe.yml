name: sign-probe

on:
  push:
    branches: [claude/brw-feature-parity-review-867c45]

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.1.4
      - run: echo "probe $GITHUB_SHA" > checksums.txt
      - run: cosign sign-blob --yes --bundle=checksums.txt.sigstore.json checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: probe
          path: |
            checksums.txt
            checksums.txt.sigstore.json
